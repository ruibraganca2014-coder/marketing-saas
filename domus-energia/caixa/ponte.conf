# Domus Energia — ponte da caixa de casa (Home Assistant) para o servidor
# Vai para /share/mosquitto/ponte.conf no Raspberry Pi (add-on "Mosquitto broker"
# com customize: {active: true, folder: mosquitto}). Ver docs/HOME-ASSISTANT.md.
# Gerar com "./domus.sh caixa <cliente>" (troca os marcadores em maiúsculas).

connection domus
address SERVIDOR:8883
# TLS com o certificado do servidor verificado (nome e autoridade) pelas autoridades do sistema da caixa
bridge_capath /etc/ssl/certs
bridge_tls_version tlsv1.2
remote_clientid ponte-CLIENTE
remote_username ponte-CLIENTE
remote_password SENHA_PONTE
bridge_protocol_version mqttv311
# evita que as mensagens voltem para trás (o outro lado também é Mosquitto)
try_private true
cleansession true
restart_timeout 5 30
# o servidor dá pela falta da caixa em ~30 s (1,5 x keepalive) se a internet cair
keepalive_interval 20

# Tudo o que é da casa passa nos dois sentidos; o ACL do servidor decide o que entra lá.
topic domus/CLIENTE/# both 0

# O servidor fica a saber se a caixa está ligada: 1 = ligada, 0 = caiu (testamento).
notifications true
notification_topic domus/CLIENTE/_ponte
