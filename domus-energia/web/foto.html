<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tirar foto — Domus Energia</title>
  <meta name="description" content="Tire a foto com o telemóvel: ela aparece no simulador, no computador.">
  <meta name="theme-color" content="#fefae0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a2310" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <script src="tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="simulador/fotos-remotas.css">
</head>
<body class="pagina-foto">
  <a class="saltar" href="#conteudo">Saltar para o conteúdo</a>
  <header class="topo">
    <div class="wrap">
      <a class="marca" href="index.html"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.6l8 6.6M6.2 9.6V19.4h11.6V9.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.9 9.4 10 14h2.6l-1 3.8 3-4.8H12z" fill="currentColor"/></svg></span><span>Domus <b>Energia</b></span></a>
      <nav>
        <button class="botao-tema" id="tema" type="button" aria-label="Mudar tema"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <div class="wrap estreito">
      <h1>Tirar foto</h1>
      <p class="foto-rotulo" id="foto-rotulo">A ligar ao computador…</p>
      <div class="cartao foto-cartao" id="foto-cartao">
        <p class="msg" id="foto-msg" role="status" aria-live="polite" hidden></p>
        <div id="foto-tirar" hidden>
          <label class="btn foto-botao" id="foto-camara-botao">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7H8l1.2-2h5.6L16 7h2.5A1.5 1.5 0 0 1 20 8.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>Tirar foto</span>
            <input type="file" id="foto-camara" accept="image/*" capture="environment">
          </label>
          <p class="ajuda" style="text-align:center;margin:10px 0 0">
            <label class="btn sec foto-botao" style="min-height:48px;font-size:1rem">
              <span>Escolher da galeria</span>
              <input type="file" id="foto-galeria" accept="image/*">
            </label>
          </p>
        </div>
        <div id="foto-rever" hidden>
          <img class="foto-previa" id="foto-previa" alt="A foto que vai enviar">
          <div class="form-botoes" style="margin-top:12px">
            <button class="btn" type="button" id="foto-enviar">Enviar</button>
            <button class="btn sec" type="button" id="foto-outra">Tirar outra</button>
          </div>
        </div>
        <div id="foto-seguintes-caixa" hidden>
          <h2 style="font-size:1.1rem;margin:0 0 8px">Outras fotos pedidas no computador</h2>
          <ul class="foto-seguintes" id="foto-seguintes"></ul>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>© <span id="ano"></span> Domus Energia</span>
      <a href="index.html">Site</a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script type="module" src="foto.js"></script>
</body>
</html>
