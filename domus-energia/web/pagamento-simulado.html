<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento simulado — Domus Energia</title>
  <meta name="description" content="Página de pagamento simulado da Domus Energia (modo de teste: não é cobrado nada).">
  <meta name="theme-color" content="#fefae0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a2310" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <script src="tema.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-conta pagina-pagamento">
  <a class="saltar" href="#conteudo">Saltar para o pagamento</a>
  <header class="topo">
    <div class="wrap">
      <a class="marca" href="index.html"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4.6l8 6.6M6.2 9.6V19.4h11.6V9.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.9 9.4 10 14h2.6l-1 3.8 3-4.8H12z" fill="currentColor"/></svg></span><span>Domus <b>Energia</b></span></a>
    </div>
  </header>

  <main id="conteudo">
    <section>
      <div class="wrap estreito">
        <p class="pag-simulacao" id="pag-aviso" role="note"><strong>SIMULAÇÃO</strong> — não é cobrado nada. Esta página substitui o Stripe enquanto os pagamentos reais não estão ligados.</p>
        <h1>Pagamento simulado</h1>
        <div class="cartao" id="pag-cartao" aria-live="polite">
          <p class="ajuda" id="pag-carregar">A carregar o pagamento…</p>
          <div id="pag-dados" hidden>
            <p class="pag-valor num" id="pag-valor"></p>
            <p id="pag-descricao"></p>
            <p class="ajuda" id="pag-ref"></p>
            <div class="form-botoes pag-botoes">
              <button class="btn" type="button" id="pag-sucesso">Pagar (simular sucesso)</button>
              <button class="btn sec" type="button" id="pag-falha">Simular falha</button>
              <button class="btn sec" type="button" id="pag-cancelar">Cancelar</button>
            </div>
          </div>
          <div class="msg" id="pag-msg" role="alert" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>© <span id="ano"></span> Domus Energia</span>
      <a href="index.html">Site</a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script type="module" src="pagamento-simulado.js"></script>
</body>
</html>
