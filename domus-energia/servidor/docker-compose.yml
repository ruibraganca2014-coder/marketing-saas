# Domus Energia — servidor (Mosquitto + Caddy + ntfy + motor + pagamentos + painel)
# Uso: cp .env.example .env  (e editar)  &&  docker compose up -d --build
# Contrato: ../docs/PROTOCOLO-MQTT.md (v1) e ../docs/PROTOCOLO-MQTT-v2.md (v2)
#           ../docs/PROTOCOLO-PLANOS.md (planos, subscrições e pagamentos)
#           ../docs/PAINEL-EMPRESA.md (painel da empresa)
#
#   https://HOST/          -> site (pasta ../web, só de leitura)
#   wss://HOST/mqtt        -> Mosquitto (WebSocket interno, porta 9001)
#   https://ntfy.HOST/     -> ntfy (notificações). O ntfy NÃO suporta ser servido
#                             num sub-caminho (/ntfy), por isso usa um subdomínio.
#   HOST:1883              -> MQTT simples para os aparelhos
#   https://HOST/api/...   -> pagamentos (sessão, Stripe Checkout, Customer Portal)
#   https://HOST/stripe/webhook -> pagamentos (eventos do Stripe)
#   https://HOST/painel/        -> painel da empresa (equipa; API em /painel/api/)
#   https://HOST/api/orcamento  -> painel (formulário público de orçamento)
#   https://HOST/api/orcamento/fotos -> painel (fotos do simulador, uma a uma, ≤ 1 MB)
#   https://HOST/api/catalogo   -> painel (catálogo público do simulador)

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # Garante que seguranca/passwd e seguranca/acl existem (mesmo vazios) antes
    # de arrancar, com o dono e as permissões que o Mosquitto 2 exige. O
    # Mosquitto arranca como root, lê a configuração e passa a correr como o
    # utilizador "mosquitto" (o domus.sh também altera os ficheiros como ele).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /mosquitto/config/seguranca
        cd /mosquitto/config/seguranca
        touch passwd acl
        chown -R mosquitto:mosquitto .
        chmod 0700 .
        chmod 0600 passwd acl
        chown -R mosquitto:mosquitto /mosquitto/data
        # TLS opcional (conf.d/tls.conf): certificados legíveis só pelo Mosquitto.
        if [ -d /mosquitto/config/certs ]; then
          chown -R mosquitto:mosquitto /mosquitto/config/certs
          chmod 0700 /mosquitto/config/certs
          chmod 0600 /mosquitto/config/certs/*
        fi
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"      # MQTT simples para os aparelhos (OpenBeken, Shelly)
      # - "8883:8883"    # MQTT com TLS (opcional, ver README "MQTT com TLS")
    expose:
      - "9001"           # WebSocket, só na rede interna (o Caddy faz o HTTPS)
    environment:
      TZ: Europe/Lisbon
    volumes:
      - ./mosquitto:/mosquitto/config        # mosquitto.conf e seguranca/{passwd,acl}
      - ./dados/mosquitto:/mosquitto/data    # persistência: mensagens retidas e sessões
    logging: &registos
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ntfy:
    image: binwiederhier/ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      TZ: Europe/Lisbon
      # O ntfy recusa base-url com caminho ("hosting ntfy on a sub-path is not
      # supported"), por isso vive em ntfy.<DOMUS_HOST>.
      NTFY_BASE_URL: https://ntfy.${DOMUS_HOST:?Define DOMUS_HOST no ficheiro .env}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: "24h"
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # Qualquer pessoa pode SUBSCREVER (os tópicos têm um segredo aleatório no
      # nome: domus-<cliente>-<segredo>); só o utilizador "motor" pode PUBLICAR
      # (criado pelo ./domus.sh motor com permissão write-only em domus-*).
      NTFY_AUTH_DEFAULT_ACCESS: read-only
      NTFY_ENABLE_SIGNUP: "false"
      # Opcional: notificações instantâneas no iPhone (reencaminha só um "toque"
      # pelo ntfy.sh, sem o conteúdo). Deixar vazio para desligar.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-}
    expose:
      - "80"
    volumes:
      - ./dados/ntfy:/var/lib/ntfy           # utilizadores (auth.db) e cache
    logging: *registos

  motor:
    build: ../motor
    restart: unless-stopped
    depends_on:
      - mosquitto
      - ntfy
    environment:
      TZ: Europe/Lisbon
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: motor
      MQTT_PASS: ${MOTOR_MQTT_PASS:?Define MOTOR_MQTT_PASS no ficheiro .env}
      DADOS_DIR: /dados
      NTFY_URL: http://ntfy
      NTFY_USER: motor
      NTFY_PASS: ${NTFY_MOTOR_PASS:?Define NTFY_MOTOR_PASS no ficheiro .env}
      NTFY_PUBLIC_URL: https://ntfy.${DOMUS_HOST}
      # Se o ficheiro não existir, o FCM fica desligado (sem erro).
      FCM_SERVICE_ACCOUNT: /dados/firebase-service-account.json
    volumes:
      - ./dados/motor:/dados                 # estado do motor + conta de serviço Firebase
    logging: *registos

  # Subscrições e pagamentos (Stripe). Ver README "Planos e pagamentos".
  # Sem as variáveis STRIPE_* no .env o serviço arranca na mesma: a sessão e o
  # _plano funcionam, e checkout/portal/webhook respondem "ainda não configurados".
  pagamentos:
    build: ../pagamentos
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      TZ: Europe/Lisbon
      PORTA: "8080"
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: pagamentos
      PAGAMENTOS_MQTT_PASS: ${PAGAMENTOS_MQTT_PASS:-}
      SESSAO_SEGREDO: ${SESSAO_SEGREDO:-}
      DOMUS_HOST: ${DOMUS_HOST}
      PUBLIC_URL: ${PUBLIC_URL:-}                 # vazio = https://DOMUS_HOST
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASE: ${STRIPE_PRICE_BASE:-}
      STRIPE_PRICE_CONFORTO: ${STRIPE_PRICE_CONFORTO:-}
      STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM:-}
      STRIPE_METODOS: ${STRIPE_METODOS:-card}
      DIAS_TESTE: ${DIAS_TESTE:-30}
      CONFIAR_PROXY: "1"                          # IP real do visitante vem do Caddy (X-Forwarded-For)
      DADOS_DIR: /dados
      PAGAMENTOS_CSV: /dados/pagamentos/pagamentos.csv
      EVENTOS_FICH: /dados/pagamentos/eventos-stripe.json
    expose:
      - "8080"           # só na rede interna (o Caddy faz o HTTPS)
    # Só as pastas de que precisa (nunca a dados/ inteira, que tem a
    # palavra-passe do admin): planos (partilhada com o domus.sh) e o registo
    # dos pagamentos (pagamentos.csv) + eventos do Stripe já tratados.
    volumes:
      - ./dados/planos:/dados/planos
      - ./dados/pagamentos:/dados/pagamentos
    logging: *registos

  # Painel da empresa (docs/PAINEL-EMPRESA.md). Ver README "Painel da empresa".
  # Não tem as palavras-passe do servidor: para criar clientes/aparelhos/planos
  # escreve pedidos em dados/pedidos-admin, que o ./domus.sh processar-pedidos
  # (temporizador do VPS) executa. MQTT como "painel": só leitura (alertas).
  painel:
    build: ../painel
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      TZ: Europe/Lisbon
      PORTA: "8080"
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: painel
      PAINEL_MQTT_PASS: ${PAINEL_MQTT_PASS:-}
      DOMUS_HOST: ${DOMUS_HOST}
      PUBLIC_URL: ${PUBLIC_URL:-}                 # origem aceite nos pedidos que alteram dados (CSRF)
      PAINEL_ORIGENS: ${PAINEL_ORIGENS:-}         # outras origens (ex.: https://www.domusenergia.pt)
      # Só no primeiro arranque (sem utilizadores): cria o CEO. Depois apague-as do .env.
      PAINEL_CEO_EMAIL: ${PAINEL_CEO_EMAIL:-}
      PAINEL_CEO_PASS: ${PAINEL_CEO_PASS:-}
      CONFIAR_PROXY: "1"                          # IP real do visitante vem do Caddy (X-Forwarded-For)
      DADOS_DIR: /dados
      # Assistente (IA) dos pedidos (docs/ASSISTENTE-IA.md). Vazio = desligado.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Leitura automática da foto do quadro: desligada (decisão do dono); só com LEITURA_QUADRO=1 no .env.
      LEITURA_QUADRO: ${LEITURA_QUADRO:-0}
      # Assistente (IA) dos pedidos: máximo de pedidos ao modelo em 24 h (docs/ASSISTENTE-IA.md).
      LIMITE_IA_DIA: ${LIMITE_IA_DIA:-50}
      # Conta de cliente (docs/CONTA-CLIENTE.md): site público noutra origem (Vercel) com CORS, chave das
      # credenciais da casa e SMTP dos códigos por email (sem SMTP_HOST os emails ficam no registo do painel).
      SITE_ORIGENS: ${SITE_ORIGENS:-}
      SITE_URL: ${SITE_URL:-}
      CONTA_CHAVE: ${CONTA_CHAVE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORTA: ${SMTP_PORTA:-587}
      SMTP_UTILIZADOR: ${SMTP_UTILIZADOR:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
      EMAIL_RESPOSTAS: ${EMAIL_RESPOSTAS:-}
      SMTP_SEGURANCA: ${SMTP_SEGURANCA:-}           # vazio = pela porta (465 TLS direto, outras STARTTLS)
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-20000}
      # Pagamentos do pedido (docs/PAGAMENTOS-PEDIDO.md): stripe (Checkout) ou simulado (só demonstração, explícito);
      # vazio e sem STRIPE_SECRET_KEY = desligados. IVA_TAXA: valor inicial do IVA dos pagamentos (depois, no painel).
      PAGAMENTOS_MODO: ${PAGAMENTOS_MODO:-}
      IVA_TAXA: ${IVA_TAXA:-23}
      PAGAMENTO_PEDIDO: ${PAGAMENTO_PEDIDO:-1}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PEDIDO_WEBHOOK_SECRET: ${STRIPE_PEDIDO_WEBHOOK_SECRET:-}
      STRIPE_PEDIDO_METODOS: ${STRIPE_PEDIDO_METODOS:-card,mb_way,multibanco}
    expose:
      - "8080"           # só na rede interna (o Caddy faz o HTTPS)
    # Só as pastas de que precisa (nunca a dados/ inteira nem mosquitto/):
    # a base de dados e a fila de pedidos com escrita; o resto só de leitura.
    volumes:
      - ./dados/painel:/dados/painel
      - ./dados/pedidos-admin:/dados/pedidos-admin
      - ./dados/planos:/dados/planos:ro
      - ./dados/pagamentos:/dados/pagamentos:ro
      - ./dados/clientes:/dados/clientes:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *registos

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - mosquitto
      - ntfy
      - pagamentos
      - painel
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"    # HTTP/3
    environment:
      DOMUS_HOST: ${DOMUS_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro                  # site público + área de cliente
      - ./config-site:/srv/config-site:ro   # config.js com o DOMUS_HOST (gerado pelo instalar.sh)
      - caddy_data:/data                    # certificados HTTPS (não apagar)
      - caddy_config:/config
    logging: *registos

volumes:
  caddy_data:
  caddy_config:
