# Domus Energia — Mosquitto 2
# Contrato: docs/PROTOCOLO-MQTT.md (v1), docs/PROTOCOLO-MQTT-v2.md (v2) e docs/PROTOCOLO-MQTT-v3.md (v3)
# Os ficheiros seguranca/passwd e seguranca/acl são geridos pelo ./domus.sh
# — não editar à mão.

per_listener_settings false

# --- Segurança -------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/seguranca/passwd
acl_file /mosquitto/config/seguranca/acl

# --- Persistência (mensagens retidas, ex. domus/<cliente>/_aparelhos) -------
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# --- Listeners -------------------------------------------------------------
# MQTT simples para os aparelhos (exposto na porta 1883 do VPS)
listener 1883
protocol mqtt

# MQTT sobre WebSocket para a app e o site. Só é acessível dentro da rede do
# Docker; o Caddy recebe wss://HOST/mqtt (porta 443) e encaminha para aqui.
listener 9001
protocol websockets

# --- Limites ----------------------------------------------------------------
max_keepalive 300
# 1 MB: as listas retidas do motor (_historico, _automacoes/registo…) podem
# passar dos 64 KB; o motor nunca publica mais de 900 KB (MQTT_MAX_PAYLOAD).
# Uma mensagem maior do que isto faz o Mosquitto cortar a ligação a quem a envia.
max_packet_size 1048576
max_queued_messages 1000
# Ligações simultâneas (aparelhos + app + site + motor), em todas as portas.
# Protege a memória do VPS contra excesso de ligações; subir se a empresa
# passar de ~1500 aparelhos. -1 = sem limite.
max_connections 2000

# --- Extras opcionais --------------------------------------------------------
# Todos os ficheiros *.conf desta pasta são lidos. Ex.: porta MQTT com TLS
# 8883 para os aparelhos que a suportam (copiar conf.d/tls.conf.exemplo para
# conf.d/tls.conf — ver README, "MQTT com TLS"). Sem ficheiros .conf, nada muda.
include_dir /mosquitto/config/conf.d

# --- Registos (ver com: docker compose logs -f mosquitto) --------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S
