# Domus Energia — Mosquitto 2
# Contrato: docs/PROTOCOLO-MQTT.md (v1) e docs/PROTOCOLO-MQTT-v2.md (v2)
# Os ficheiros seguranca/passwd e seguranca/acl são geridos pelo ./domus.sh
# — não editar à mão.

per_listener_settings false

# --- Segurança -------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/seguranca/passwd
acl_file /mosquitto/config/seguranca/acl

# --- Persistência (mensagens retidas, ex. domus/<cliente>/_aparelhos) -------
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# --- Listeners -------------------------------------------------------------
# MQTT simples para os aparelhos (exposto na porta 1883 do VPS)
listener 1883
protocol mqtt

# MQTT sobre WebSocket para a app e o site. Só é acessível dentro da rede do
# Docker; o Caddy recebe wss://HOST/mqtt (porta 443) e encaminha para aqui.
listener 9001
protocol websockets

# --- Limites ----------------------------------------------------------------
max_keepalive 300
max_packet_size 65536
max_queued_messages 1000

# --- Registos (ver com: docker compose logs -f mosquitto) --------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S
